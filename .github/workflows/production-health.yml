name: ArcPass production health

on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check ArcPass health
        env:
          HEALTH_URL: https://arcpass-six.vercel.app/api/health/arc
        run: |
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 "$HEALTH_URL")"
          echo "$response" | jq --exit-status '.ok == true and .network == "Arc Testnet" and .chainId == 5042002 and .database == "connected"' >/dev/null
